name: Update BiliSum for LazyCat
run-name: ${{ (github.event_name == 'push' || inputs.dry-run) && 'BiliSum → LazyCat [仅检查]' || 'BiliSum → LazyCat [验证升级、打包并送审]' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - content/**
      - image/**
      - scripts/**
      - tests/**
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
      - icon.png
  schedule:
    # 04:37 UTC = 12:37 Asia/Shanghai.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选仅验证镜像和检查更新；取消勾选后转存、打包并送审。
        type: boolean
        default: true
      retry-rejected:
        description: 适配已修复时，使用新应用版本重试被拒绝的源版本（须取消仅检查）。
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: bilisum-lazycat-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the browser login flow
        run: node --test tests/login.test.cjs
      - name: Check developer access to the existing BiliSum package
        env:
          LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${LZC_API_TOKEN:?Authorize the organization LZC_API_TOKEN secret for this repository}"
          api_host="${LZC_API_HOST:-https://appstore.api.lazycat.cloud}"
          curl --fail --silent --show-error --retry 2 \
            --header "X-API-Token: ${LZC_API_TOKEN}" \
            "${api_host%/}/sdk/v3/developer/app/cloud.lazycat.app.bilisum1/review/list?page=0&size=1" |
            python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin).get("errorCode") == 0 else "Developer PAT lacks access to cloud.lazycat.app.bilisum1")'
      - name: Verify the latest stable image and persistently stored data
        if: github.event_name == 'push' || inputs.dry-run
        run: python3 -B scripts/prepare.py --verify-only

  update:
    needs: validate
    permissions:
      contents: write
      pull-requests: write
    uses: lazycat-adapter/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      runner: ubuntu-24.04
      toolchains: docker
      enable-qemu: false
      dry-run: ${{ github.event_name == 'push' || inputs.dry-run || false }}
      retry-rejected: ${{ github.event_name == 'workflow_dispatch' && inputs.retry-rejected || false }}
    secrets: inherit
